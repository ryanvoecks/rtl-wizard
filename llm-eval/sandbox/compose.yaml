x-sandbox-base: &sandbox-base
  image: llm-eval-sandbox:latest
  command: "tail -f /dev/null"
  init: true

services:
  solver:
    <<: *sandbox-base
    x-default: true
    build:
      context: .
      dockerfile: Dockerfile
    # `shared.name` is rewritten by tasks.py to a shared host network.
    networks:
      - default
      - shared

networks:
  default:
  shared:
    external: true
    name: bridge
