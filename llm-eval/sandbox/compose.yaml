x-sandbox-base: &sandbox-base
  image: new-benchmark-sandbox:latest
  command: "tail -f /dev/null"
  init: true
  stop_grace_period: 1s

services:
  solver:
    <<: *sandbox-base
    x-default: true
    build:
      context: .
      dockerfile: Dockerfile
    # `shared` is an external network the devcontainer also sits on, so the
    # agent can reach the per-sample host MCP server (see host_mcp.py) on the
    # devcontainer's IP. The network name is filled in at run time by
    # `host_mcp._discover_shared_network()`; if it's empty (e.g. when running
    # outside a devcontainer) the sandbox just uses the compose default
    # network and the MCP URL falls back to `host.docker.internal`.
    networks:
      - default
      - shared

networks:
  default:
  shared:
    external: true
    name: ${RTL_WIZARD_SHARED_NETWORK:-bridge}
