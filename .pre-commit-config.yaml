exclude: '^(common/patches/|artifacts/|llm_eval/prompts/summaries/)'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-ast

  - repo: local
    hooks:
    - id: pyright
      name: pyright
      entry: uv run pyright
      language: system
      types: [python]
    - id: ruff-check
      name: ruff-check
      entry: uv run ruff check
      language: system
      types: [python]
    - id: ruff-format
      name: ruff-format
      entry: uv run ruff format --check
      language: system
      types: [python]

  - repo: local
    hooks:
      - id: ascii-only
        name: ASCII-only check
        language: pygrep
        entry: '[^\x00-\x7F]'
