repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-ast

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff-format
        args: [--check]
      - id: ruff
        args: [--no-fix]

  - repo: local
    hooks:
      - id: ascii-only
        name: ASCII-only check
        language: pygrep
        entry: '[^\x00-\x7F]'
