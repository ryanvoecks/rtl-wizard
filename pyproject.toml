[project]
name = "rtl-wizard"
version = "0.1.0"
description = "MCP server for RTL development"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.102.0",
    "google-genai>=1.73.1",
    "inspect-ai>=0.3.212",
    "inspect-swe>=0.2.47",
    "mcp>=1.27.0",
    "openai>=2.32.0",
    "pyright[nodejs]>=1.1.409",
    "pyslang>=10",
    "pytest>=8.0",
    "ruff>=0.15.13",
    "tqdm>=4.67",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common"]

[tool.ruff]
extend-exclude = ["external"]

[tool.ruff.lint]
select = ["E", "F", "I"]
